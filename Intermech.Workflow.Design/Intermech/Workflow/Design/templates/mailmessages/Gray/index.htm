<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">

<html>
<head>
<title>Untitled</title>
<meta content="text/html; charset=UTF-8" http-equiv="content-type">
    <style>
        body {
            padding: 0px;
            margin: 0px;
            font-family: Tahoma, sans-serif;
            font-size: 12px;
            overflow-x: hidden;
            overflow-y: auto; /*IE8 horiz scrollbar fix*/
        }
        table {
            width: 100%;
        }

        th {
            text-align: left;
        }
        .header {
            padding: 10px 23px 10px 26px;
            margin: 0px;
            FONT-WEIGHT: bold;
            font-size: 12px;
            height: 37px;
            background: #ccc;
        }
        .block {
            width: 100%;
            padding: 16px 23px 16px 23px;
            margin: 0px;
            BORDER-TOP: #fff 1px solid;
            BORDER-BOTTOM: #989898 1px solid;
            background: #f0f0f0;
        }
        .w {
            padding-left: 0px;
            width: 100%;
        }
        .right {
            FLOAT: left;
        }
        .c {
            margin-right: 15px;
        }
        .from_right {
            padding: 0px 2px 15px 10px;
            FONT-WEIGHT: bold;
        }
        .from_right1 {
            padding: 0px 2px 10px 10px;
            FONT-WEIGHT: bold;
        }
        .left {
            padding: 0px 0px 10px 5px;
            width: 85px;
        }
        .right {
            padding: 0px 0px 10px 10px;
        }

        .answer {
            padding: 10px 20px 10px 20px;
            font-size: 100%;
            margin: 0px;
            BORDER: #bdbdbd 1px solid;
            background: #fff;
        }

        a {
            text-decoration: underline;
            color: #175477;
        }
        a:hover {
            color: #3ca9f6
        }
	</style>
	
</head>

<body>
    <table>
        {$Message}
    </table>
<table>
    <tr>
        <th class="header">{$HeaderText}</th>
    </tr>
    {$Messages}
</table>
</body>
</html>
